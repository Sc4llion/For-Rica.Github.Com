<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Rica — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --cream: #fdf8f0; --cream-deep: #f5ede0;
      --ink: #2c2016; --ink-light: #6b5744; --ink-faint: #a8917c;
      --blush: #e8c4a0; --rose: #c97d5a; --rose-dark: #a05f40;
      --green: #6a9f6a; --red: #b85555;
      --border: rgba(185,130,80,0.15); --border-strong: rgba(185,130,80,0.30);
      --shadow-warm: rgba(100,60,20,0.07);
      --font-serif: "Cormorant Garamond", serif;
      --font-sans: "Lato", sans-serif;
    }

    html, body {
      min-height: 100vh; background-color: var(--cream);
      font-family: var(--font-sans); font-weight: 300;
      color: var(--ink); overflow-x: hidden;
    }

    body::before {
      content: ""; position: fixed; inset: 0;
      background: radial-gradient(ellipse at 10% 20%, rgba(200,140,100,0.08) 0%, transparent 50%),
                  radial-gradient(ellipse at 90% 80%, rgba(185,130,80,0.07) 0%, transparent 50%);
      pointer-events: none; z-index: 0;
    }

    /* ── PETALS ── */
    .petals-container { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
    .petal { position: absolute; top: -40px; background: radial-gradient(ellipse at 40% 30%, #f2c4a8, #d9896a); border-radius: 50% 0 50% 0; opacity: 0; animation: petalFall linear infinite; }
    @keyframes petalFall { 0%{transform:translateY(0) rotate(0deg) translateX(0);opacity:0;} 5%{opacity:0.5;} 95%{opacity:0.2;} 100%{transform:translateY(110vh) rotate(360deg) translateX(60px);opacity:0;} }
    .petal:nth-child(1){left:5%;width:8px;height:11px;animation-duration:9s;animation-delay:0s;}
    .petal:nth-child(2){left:15%;width:12px;height:16px;animation-duration:11s;animation-delay:1.5s;}
    .petal:nth-child(3){left:28%;width:9px;height:12px;animation-duration:8s;animation-delay:3s;}
    .petal:nth-child(4){left:40%;width:11px;height:15px;animation-duration:13s;animation-delay:0.8s;}
    .petal:nth-child(5){left:55%;width:8px;height:11px;animation-duration:10s;animation-delay:2.2s;}
    .petal:nth-child(6){left:68%;width:13px;height:17px;animation-duration:9s;animation-delay:4s;}
    .petal:nth-child(7){left:78%;width:9px;height:12px;animation-duration:12s;animation-delay:1s;}
    .petal:nth-child(8){left:88%;width:10px;height:14px;animation-duration:8s;animation-delay:3.5s;}
    .petal:nth-child(9){left:22%;width:7px;height:10px;animation-duration:14s;animation-delay:5s;}
    .petal:nth-child(10){left:62%;width:11px;height:15px;animation-duration:11s;animation-delay:6s;}

    @keyframes fadeUp { from{opacity:0;transform:translateY(30px);} to{opacity:1;transform:translateY(0);} }

    /* ── LOGIN GATE ── */
    #admin-login {
      position: fixed; inset: 0; z-index: 999;
      background: var(--cream);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    #admin-login.hidden { display: none; }

    .login-box { max-width: 380px; width: 100%; animation: fadeUp 0.8s ease both; }

    .login-ornament { text-align: center; margin-bottom: 28px; }
    .login-ornament .star { font-family: var(--font-serif); font-size: 22px; color: var(--rose); letter-spacing: 8px; display: block; margin-bottom: 6px; }
    .login-ornament .line { display: inline-block; width: 70px; height: 0.5px; background: linear-gradient(to right, transparent, var(--blush), transparent); vertical-align: middle; }
    .login-ornament .diamond { display: inline-block; width: 5px; height: 5px; background: var(--rose); transform: rotate(45deg); margin: 0 10px; vertical-align: middle; }

    .login-card {
      background: #fffdf8; border: 0.5px solid rgba(185,130,80,0.2);
      border-radius: 2px; padding: 40px 36px; position: relative;
      box-shadow: 0 2px 40px var(--shadow-warm);
    }
    .login-card::after { content:""; position:absolute; inset:10px; border:0.5px solid rgba(185,130,80,0.07); border-radius:1px; pointer-events:none; }

    .login-card h2 { font-family: var(--font-serif); font-weight: 300; font-size: 28px; color: var(--ink); letter-spacing: 2px; margin-bottom: 4px; }
    .login-card .sub { font-family: var(--font-serif); font-style: italic; font-size: 13px; color: var(--ink-faint); letter-spacing: 2px; margin-bottom: 30px; display: block; }

    .field { margin-bottom: 20px; }
    .field label { display: block; font-size: 11px; letter-spacing: 2px; color: var(--rose); margin-bottom: 8px; text-transform: uppercase; }
    .field input {
      width: 100%; background: transparent; border: none;
      border-bottom: 1px solid var(--border-strong);
      padding: 8px 0; font-family: var(--font-sans); font-size: 14px;
      font-weight: 300; color: var(--ink); outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus { border-bottom-color: var(--rose); }
    .field input::placeholder { color: var(--ink-faint); font-style: italic; font-family: var(--font-serif); }

    .btn-primary {
      width: 100%; margin-top: 28px; background: transparent;
      border: 0.5px solid var(--border-strong); border-radius: 2px;
      padding: 12px; font-family: var(--font-sans); font-size: 11px;
      font-weight: 400; letter-spacing: 3px; color: var(--ink-light);
      cursor: pointer; transition: all 0.2s; text-transform: uppercase;
    }
    .btn-primary:hover { background: rgba(201,125,90,0.08); border-color: var(--rose); color: var(--rose); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .login-error { display: none; margin-top: 14px; text-align: center; font-family: var(--font-serif); font-style: italic; font-size: 13px; color: var(--red); }
    .login-error.show { display: block; }

    /* ── MAIN ADMIN UI ── */
    #admin-ui { position: relative; z-index: 2; max-width: 760px; margin: 0 auto; padding: 60px 20px 80px; animation: fadeUp 0.8s ease both; }

    .admin-header { text-align: center; margin-bottom: 48px; }
    .admin-header .ornament { font-family: var(--font-serif); font-size: 22px; color: var(--rose); letter-spacing: 8px; display: block; margin-bottom: 8px; }
    .admin-header .deco-line { display: inline-block; width: 80px; height: 0.5px; background: linear-gradient(to right, transparent, var(--blush), transparent); vertical-align: middle; }
    .admin-header .deco-diamond { display: inline-block; width: 5px; height: 5px; background: var(--rose); transform: rotate(45deg); margin: 0 10px; vertical-align: middle; }
    .admin-header h1 { font-family: var(--font-serif); font-weight: 300; font-size: 36px; color: var(--ink); letter-spacing: 2px; margin: 16px 0 6px; }
    .admin-header p { font-family: var(--font-serif); font-style: italic; font-size: 14px; color: var(--ink-faint); letter-spacing: 2px; }

    /* Back link */
    .back-link { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink-faint); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 32px; transition: color 0.2s; }
    .back-link:hover { color: var(--rose); }

    /* Logout */
    .logout-btn { float: right; background: none; border: 0.5px solid var(--border); border-radius: 2px; padding: 6px 14px; font-size: 11px; letter-spacing: 2px; color: var(--ink-faint); cursor: pointer; transition: all 0.2s; text-transform: uppercase; }
    .logout-btn:hover { border-color: var(--rose); color: var(--rose); }

    /* ── SECTION CARDS ── */
    .section-card {
      background: #fffdf8; border: 0.5px solid rgba(185,130,80,0.2);
      border-radius: 2px; padding: 40px 44px; margin-bottom: 24px;
      position: relative; box-shadow: 0 2px 30px var(--shadow-warm);
    }
    .section-card::after { content:""; position:absolute; inset:10px; border:0.5px solid rgba(185,130,80,0.06); border-radius:1px; pointer-events:none; }

    .section-title { font-family: var(--font-serif); font-size: 24px; font-weight: 300; color: var(--ink); letter-spacing: 2px; margin-bottom: 4px; }
    .section-sub { font-family: var(--font-serif); font-style: italic; font-size: 13px; color: var(--rose); letter-spacing: 1px; margin-bottom: 28px; display: block; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 11px; letter-spacing: 2px; color: var(--rose); margin-bottom: 8px; text-transform: uppercase; }

    .form-group input[type="text"],
    .form-group input[type="date"],
    .form-group textarea {
      width: 100%; background: transparent; border: none;
      border-bottom: 1px solid var(--border-strong);
      padding: 10px 0; font-family: var(--font-sans); font-size: 14px;
      font-weight: 300; color: var(--ink); outline: none;
      transition: border-color 0.2s; resize: vertical;
    }
    .form-group input:focus, .form-group textarea:focus { border-bottom-color: var(--rose); }
    .form-group input::placeholder, .form-group textarea::placeholder { color: var(--ink-faint); font-style: italic; font-family: var(--font-serif); }
    .form-group textarea { min-height: 120px; padding-top: 10px; }

    /* File drop zone */
    .drop-zone {
      border: 1px dashed var(--border-strong); border-radius: 2px;
      padding: 32px 20px; text-align: center; cursor: pointer;
      transition: all 0.2s; background: rgba(232,196,160,0.04);
      position: relative;
    }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--rose); background: rgba(201,125,90,0.06); }
    .drop-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .drop-zone .dz-icon { font-size: 28px; opacity: 0.4; display: block; margin-bottom: 10px; }
    .drop-zone .dz-label { font-family: var(--font-serif); font-style: italic; font-size: 15px; color: var(--ink-faint); }
    .drop-zone .dz-sub { font-size: 11px; letter-spacing: 1px; color: var(--ink-faint); margin-top: 4px; opacity: 0.6; }

    /* Photo preview grid */
    .photo-preview-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
    .preview-item { position: relative; aspect-ratio: 1; border-radius: 2px; overflow: hidden; border: 0.5px solid var(--border); }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; filter: sepia(8%) saturate(90%); }
    .preview-item .remove-preview { position: absolute; top: 4px; right: 4px; background: rgba(44,32,22,0.7); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .preview-item .preview-caption { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(44,32,22,0.6); padding: 4px 6px; }
    .preview-item .preview-caption input { width: 100%; background: transparent; border: none; color: white; font-size: 10px; outline: none; font-family: var(--font-serif); font-style: italic; }

    /* Action button */
    .action-btn {
      margin-top: 24px; background: transparent;
      border: 0.5px solid var(--border-strong); border-radius: 2px;
      padding: 13px 32px; font-family: var(--font-sans); font-size: 11px;
      font-weight: 400; letter-spacing: 3px; color: var(--ink-light);
      cursor: pointer; transition: all 0.25s; text-transform: uppercase;
    }
    .action-btn:hover { background: rgba(201,125,90,0.08); border-color: var(--rose); color: var(--rose); }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .action-btn.loading::after { content: " ..."; }

    /* Status messages */
    .status-msg {
      display: none; margin-top: 16px; padding: 12px 16px;
      border-radius: 2px; font-size: 13px; font-family: var(--font-serif);
      font-style: italic; letter-spacing: 0.5px;
    }
    .status-msg.show { display: block; }
    .status-msg.success { background: rgba(106,159,106,0.1); border: 0.5px solid rgba(106,159,106,0.3); color: var(--green); }
    .status-msg.error   { background: rgba(184,85,85,0.1);  border: 0.5px solid rgba(184,85,85,0.3);  color: var(--red); }
    .status-msg.info    { background: rgba(185,130,80,0.08); border: 0.5px solid var(--border-strong); color: var(--ink-light); }

    /* Progress bar */
    .progress-bar { display: none; margin-top: 12px; height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; }
    .progress-bar.show { display: block; }
    .progress-fill { height: 100%; background: var(--rose); width: 0%; transition: width 0.3s ease; }

    /* Divider */
    .section-divider { border: none; border-top: 0.5px solid var(--border); margin: 32px 0; }

    @media(max-width:600px) {
      .section-card { padding: 28px 22px; }
      .photo-preview-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- PETALS -->
  <div class="petals-container" aria-hidden="true">
    <div class="petal"></div><div class="petal"></div><div class="petal"></div>
    <div class="petal"></div><div class="petal"></div><div class="petal"></div>
    <div class="petal"></div><div class="petal"></div><div class="petal"></div>
    <div class="petal"></div>
  </div>

  <!-- ============================================================
       ADMIN LOGIN GATE
       Password protects the admin panel
       ============================================================ -->
  <div id="admin-login">
    <div class="login-box">
      <div class="login-ornament">
        <span class="star">✦</span>
        <span class="line"></span><span class="diamond"></span><span class="line"></span>
      </div>
      <div class="login-card">
        <h2>Admin</h2>
        <span class="sub">only for miggy</span>
        <div class="field">
          <label>Password</label>
          <input type="password" id="admin-pass" placeholder="enter admin password" />
        </div>
        <button class="btn-primary" id="admin-login-btn">Enter</button>
        <div class="login-error" id="admin-error">Wrong password. Try again.</div>
      </div>
    </div>
  </div>

  <!-- ============================================================
       ADMIN UI (shown after login)
       ============================================================ -->
  <div id="admin-ui" style="display:none;">

    <div class="admin-header">
      <button class="logout-btn" id="admin-logout">Log out</button>
      <a class="back-link" href="index.html">← back to site</a>
      <span class="ornament">✦</span>
      <span class="deco-line"></span><span class="deco-diamond"></span><span class="deco-line"></span>
      <h1>Admin Panel</h1>
      <p>upload letters &amp; photos to github</p>
    </div>

    <!-- ══════════════════════════════════════════════
         SECTION 1 — UPLOAD PHOTOS
         ══════════════════════════════════════════════ -->
    <div class="section-card">
      <div class="section-title">Upload Photos</div>
      <span class="section-sub">add new photos to the gallery</span>

      <!-- Drop zone -->
      <div class="drop-zone" id="photo-drop">
        <input type="file" id="photo-files" accept="image/*" multiple />
        <span class="dz-icon">✾</span>
        <div class="dz-label">Click or drag photos here</div>
        <div class="dz-sub">JPG, PNG, WEBP, JFIF — multiple allowed</div>
      </div>

      <!-- Preview grid (filled by JS) -->
      <div class="photo-preview-grid" id="photo-preview-grid"></div>

      <!-- Upload button -->
      <button class="action-btn" id="upload-photos-btn">Upload Photos to GitHub</button>
      <div class="progress-bar" id="photo-progress"><div class="progress-fill" id="photo-progress-fill"></div></div>
      <div class="status-msg" id="photo-status"></div>
    </div>

    <!-- ══════════════════════════════════════════════
         SECTION 2 — WRITE A LETTER
         ══════════════════════════════════════════════ -->
    <div class="section-card">
      <div class="section-title">Write a Letter</div>
      <span class="section-sub">publish a new letter to the letters page</span>

      <div class="form-group">
        <label>Salutation</label>
        <input type="text" id="letter-salutation" placeholder="Dear Rica, Riri, Little Major," />
      </div>

      <div class="form-group">
        <label>Date</label>
        <input type="text" id="letter-date" placeholder="April 2026" />
      </div>

      <div class="form-group">
        <label>Letter Body</label>
        <textarea id="letter-body" placeholder="Write your letter here...&#10;&#10;Each blank line between paragraphs becomes a new paragraph."></textarea>
      </div>

      <div class="form-group">
        <label>Closing (e.g. With love and gratitude,)</label>
        <input type="text" id="letter-closing" placeholder="With love and gratitude," />
      </div>

      <div class="form-group">
        <label>Archive Title (shown in the letters list)</label>
        <input type="text" id="letter-archive-title" placeholder="The One That Started It All" />
      </div>

      <button class="action-btn" id="publish-letter-btn">Publish Letter to GitHub</button>
      <div class="status-msg" id="letter-status"></div>
    </div>

  </div><!-- /#admin-ui -->

  <script>
    /* ============================================================
       CONFIGURATION
       ============================================================ */
    const GITHUB_TOKEN = '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';
    const GITHUB_USER  = 'Sc4llion';
    const GITHUB_REPO  = 'For-Rica.Github.Com';
    const BRANCH       = 'main'; // change to 'master' if your repo uses that

    /* Admin password — change this to whatever you want */
    const ADMIN_PASSWORD = 'Miggy2026';

    /* ============================================================
       GITHUB API HELPERS
       ============================================================ */

    /* Get a file from GitHub (returns { content, sha } or null) */
    async function githubGet(path) {
      const res = await fetch(
        `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}?ref=${BRANCH}`,
        { headers: { Authorization: `token ${GITHUB_TOKEN}`, Accept: 'application/vnd.github.v3+json' } }
      );
      if (!res.ok) return null;
      return res.json();
    }

    /* Create or update a file on GitHub */
    async function githubPut(path, base64Content, message, sha = null) {
      const body = { message, content: base64Content, branch: BRANCH };
      if (sha) body.sha = sha; // required when updating existing file
      const res = await fetch(
        `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`,
        {
          method: 'PUT',
          headers: { Authorization: `token ${GITHUB_TOKEN}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        }
      );
      return res.ok ? res.json() : null;
    }

    /* Convert a File object to base64 string */
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload  = e => resolve(e.target.result.split(',')[1]); // strip data: prefix
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    /* Convert plain text (HTML string) to base64 */
    function textToBase64(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }

    /* Decode base64 to text */
    function base64ToText(b64) {
      return decodeURIComponent(escape(atob(b64)));
    }

    /* Show a status message */
    function showStatus(el, type, msg) {
      el.className = `status-msg show ${type}`;
      el.textContent = msg;
    }

    /* ============================================================
       ADMIN LOGIN
       ============================================================ */
    const adminLogin    = document.getElementById('admin-login');
    const adminUI       = document.getElementById('admin-ui');
    const adminPassInput= document.getElementById('admin-pass');
    const adminLoginBtn = document.getElementById('admin-login-btn');
    const adminError    = document.getElementById('admin-error');
    const adminLogout   = document.getElementById('admin-logout');

    const ADMIN_SESSION = 'rica-admin-session';

    /* Check existing session */
    if (sessionStorage.getItem(ADMIN_SESSION) === 'ok') {
      adminLogin.classList.add('hidden');
      adminUI.style.display = 'block';
    }

    adminLoginBtn.addEventListener('click', () => {
      if (adminPassInput.value === ADMIN_PASSWORD) {
        sessionStorage.setItem(ADMIN_SESSION, 'ok');
        adminLogin.classList.add('hidden');
        adminUI.style.display = 'block';
        adminError.classList.remove('show');
      } else {
        adminError.classList.add('show');
        adminPassInput.value = '';
        adminPassInput.focus();
      }
    });

    adminPassInput.addEventListener('keydown', e => { if (e.key === 'Enter') adminLoginBtn.click(); });

    adminLogout.addEventListener('click', () => {
      sessionStorage.removeItem(ADMIN_SESSION);
      adminLogin.classList.remove('hidden');
      adminUI.style.display = 'none';
    });

    /* ============================================================
       PHOTO UPLOAD SECTION
       ============================================================ */
    const photoFiles    = document.getElementById('photo-files');
    const photoDrop     = document.getElementById('photo-drop');
    const previewGrid   = document.getElementById('photo-preview-grid');
    const uploadBtn     = document.getElementById('upload-photos-btn');
    const photoStatus   = document.getElementById('photo-status');
    const photoProgress = document.getElementById('photo-progress');
    const photoFill     = document.getElementById('photo-progress-fill');

    let selectedPhotos = []; // Array of { file, caption }

    /* Drag-over highlight */
    photoDrop.addEventListener('dragover', e => { e.preventDefault(); photoDrop.classList.add('dragover'); });
    photoDrop.addEventListener('dragleave', () => photoDrop.classList.remove('dragover'));
    photoDrop.addEventListener('drop', e => {
      e.preventDefault();
      photoDrop.classList.remove('dragover');
      const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
      addPhotos(files);
    });

    photoFiles.addEventListener('change', e => {
      addPhotos(Array.from(e.target.files));
      photoFiles.value = '';
    });

    function addPhotos(files) {
      files.forEach(file => {
        const caption = file.name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
        selectedPhotos.push({ file, caption });
        renderPreviews();
      });
    }

    function renderPreviews() {
      previewGrid.innerHTML = '';
      selectedPhotos.forEach((p, i) => {
        const url = URL.createObjectURL(p.file);
        const div = document.createElement('div');
        div.className = 'preview-item';
        div.innerHTML = `
          <img src="${url}" alt="" />
          <button class="remove-preview" data-i="${i}">&times;</button>
          <div class="preview-caption">
            <input type="text" value="${p.caption}" placeholder="caption" data-i="${i}" />
          </div>
        `;
        previewGrid.appendChild(div);
      });

      /* Remove buttons */
      previewGrid.querySelectorAll('.remove-preview').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedPhotos.splice(parseInt(btn.dataset.i), 1);
          renderPreviews();
        });
      });

      /* Caption inputs */
      previewGrid.querySelectorAll('input[data-i]').forEach(input => {
        input.addEventListener('input', () => {
          selectedPhotos[parseInt(input.dataset.i)].caption = input.value;
        });
      });
    }

    /* ── UPLOAD PHOTOS to GitHub ── */
    uploadBtn.addEventListener('click', async () => {
      if (selectedPhotos.length === 0) {
        showStatus(photoStatus, 'error', 'Please select at least one photo first.');
        return;
      }

      uploadBtn.disabled = true;
      uploadBtn.classList.add('loading');
      photoProgress.classList.add('show');
      showStatus(photoStatus, 'info', `Uploading ${selectedPhotos.length} photo(s) to GitHub…`);

      try {
        /* Step 1: Fetch current photos.html from GitHub */
        showStatus(photoStatus, 'info', 'Reading photos.html from GitHub…');
        const fileData = await githubGet('photos.html');
        if (!fileData) throw new Error('Could not read photos.html from GitHub. Check your repo name and branch.');

        let html = base64ToText(fileData.content.replace(/\n/g, ''));
        const sha = fileData.sha;

        /* Step 2: Upload each image file */
        let uploaded = 0;
        const newTiles = [];

        for (const photo of selectedPhotos) {
          const ext      = photo.file.name.split('.').pop().toLowerCase();
          const safeName = photo.file.name.replace(/\s+/g, '-');
          const imgPath  = `photos/${safeName}`;

          showStatus(photoStatus, 'info', `Uploading ${photo.file.name}… (${uploaded + 1}/${selectedPhotos.length})`);
          photoFill.style.width = `${Math.round((uploaded / selectedPhotos.length) * 60)}%`;

          const b64 = await fileToBase64(photo.file);

          /* Check if file already exists (need sha to overwrite) */
          const existing = await githubGet(imgPath);
          const result   = await githubPut(imgPath, b64, `Add photo: ${safeName}`, existing?.sha);

          if (!result) throw new Error(`Failed to upload ${photo.file.name}. Check your token permissions.`);

          /* Build the HTML tile for this photo */
          newTiles.push(`
  <!-- PHOTO: ${photo.caption} -->
  <div class="photo-tile" data-caption="${photo.caption}">
    <div class="photo-frame"><img src="photos/${safeName}" alt="${photo.caption}" /></div>
    <div class="photo-overlay"><span class="photo-caption">${photo.caption}</span></div>
  </div>`);

          uploaded++;
        }

        photoFill.style.width = '70%';

        /* Step 3: Inject new tiles into photos.html before closing </div> of #photo-grid */
        const insertMarker = '</div>\n\n        <div class="upload-note">';
        const altMarker    = '</div>\n\n\n        <div class="upload-note">';

        const tileHtml = newTiles.join('\n');

        if (html.includes(insertMarker)) {
          html = html.replace(insertMarker, tileHtml + '\n          ' + insertMarker);
        } else if (html.includes(altMarker)) {
          html = html.replace(altMarker, tileHtml + '\n          ' + altMarker);
        } else {
          /* Fallback: insert before upload-note div */
          html = html.replace('<div class="upload-note">', tileHtml + '\n\n        <div class="upload-note">');
        }

        photoFill.style.width = '85%';

        /* Step 4: Push updated photos.html back to GitHub */
        showStatus(photoStatus, 'info', 'Saving photos.html to GitHub…');
        const saveResult = await githubPut('photos.html', textToBase64(html), `Add ${selectedPhotos.length} photo(s) via admin panel`, sha);

        if (!saveResult) throw new Error('Failed to save photos.html. The file may have been modified — try again.');

        photoFill.style.width = '100%';
        showStatus(photoStatus, 'success', `✦ ${selectedPhotos.length} photo(s) uploaded successfully! Your site will update in a few seconds.`);

        /* Clear selection */
        selectedPhotos = [];
        renderPreviews();

      } catch (err) {
        showStatus(photoStatus, 'error', `Error: ${err.message}`);
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.classList.remove('loading');
        setTimeout(() => { photoProgress.classList.remove('show'); photoFill.style.width = '0%'; }, 2000);
      }
    });

    /* ============================================================
       LETTER PUBLISHING SECTION
       ============================================================ */
    const letterSalutation   = document.getElementById('letter-salutation');
    const letterDate         = document.getElementById('letter-date');
    const letterBody         = document.getElementById('letter-body');
    const letterClosing      = document.getElementById('letter-closing');
    const letterArchiveTitle = document.getElementById('letter-archive-title');
    const publishBtn         = document.getElementById('publish-letter-btn');
    const letterStatus       = document.getElementById('letter-status');

    publishBtn.addEventListener('click', async () => {
      const salutation   = letterSalutation.value.trim();
      const date         = letterDate.value.trim();
      const body         = letterBody.value.trim();
      const closing      = letterClosing.value.trim();
      const archiveTitle = letterArchiveTitle.value.trim();

      if (!salutation || !body || !date) {
        showStatus(letterStatus, 'error', 'Please fill in at least the salutation, date, and body.');
        return;
      }

      publishBtn.disabled = true;
      publishBtn.classList.add('loading');
      showStatus(letterStatus, 'info', 'Reading letters.html from GitHub…');

      try {
        /* Step 1: Fetch current letters.html */
        const fileData = await githubGet('letters.html');
        if (!fileData) throw new Error('Could not read letters.html from GitHub.');

        let html = base64ToText(fileData.content.replace(/\n/g, ''));
        const sha = fileData.sha;

        /* Step 2: Build paragraph HTML from body text */
        const paragraphs = body
          .split(/\n\s*\n/)
          .map(p => p.trim())
          .filter(Boolean)
          .map(p => `            <p>${p.replace(/\n/g, '<br />')}</p>`)
          .join('\n');

        /* Step 3: Build the new <article> block */
        const newLetter = `
        <!-- ═══ LETTER: ${archiveTitle || date} ═══ -->
        <article class="letter-paper">
          <div class="letter-date">${date}</div>
          <div class="letter-salutation">${salutation}</div>
          <div class="letter-body">
${paragraphs}
          </div>
          <div class="letter-closing">
            <div class="closing-label">${closing || 'With love,'}</div>
            <div class="closing-name">Miggy</div>
          </div>
        </article>
`;

        /* Step 4: Insert new letter BEFORE the archive section */
        const archiveMarker = '<!-- Archive index';
        if (html.includes(archiveMarker)) {
          html = html.replace(archiveMarker, newLetter + '\n        ' + archiveMarker);
        } else {
          /* Fallback: insert before .letters-archive div */
          html = html.replace('<div class="letters-archive">', newLetter + '\n        <div class="letters-archive">');
        }

        /* Step 5: Add entry to the archive list */
        const archiveEntry = `
          <div class="archive-item">
            <span class="archive-title">${archiveTitle || 'A Letter'}</span>
            <span class="archive-date">${date}</span>
            <span class="archive-badge">new</span>
          </div>`;

        html = html.replace(
          '<div class="archive-item">',
          archiveEntry + '\n          <div class="archive-item">'
        );

        /* Step 6: Push updated letters.html to GitHub */
        showStatus(letterStatus, 'info', 'Saving letters.html to GitHub…');
        const saveResult = await githubPut('letters.html', textToBase64(html), `Add letter: ${archiveTitle || date}`, sha);

        if (!saveResult) throw new Error('Failed to save letters.html. Try again.');

        showStatus(letterStatus, 'success', '✦ Letter published successfully! Your site will update in a few seconds.');

        /* Clear form */
        letterSalutation.value = '';
        letterDate.value       = '';
        letterBody.value       = '';
        letterClosing.value    = '';
        letterArchiveTitle.value = '';

      } catch (err) {
        showStatus(letterStatus, 'error', `Error: ${err.message}`);
      } finally {
        publishBtn.disabled = false;
        publishBtn.classList.remove('loading');
      }
    });
  </script>

</body>
</html>
